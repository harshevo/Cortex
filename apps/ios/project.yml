# The Xcode project is written from this file: `xcodegen` in this folder.
# Run scripts/mobile-ios.sh first; it builds the core the app links.
name: Cortex
options:
  bundleIdPrefix: dev.cortex
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
targets:
  Cortex:
    type: application
    platform: iOS
    sources:
      - Cortex
      - Core/cortex_mobile.swift
    dependencies:
      - framework: Core/CortexCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    # What the generated Info.plist cannot say: the one piece of
    # background work the system may wake the app for.
    info:
      path: Support/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - dev.cortex.remote.rest
        UIBackgroundModes:
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cortex.remote
        PRODUCT_NAME: Cortex
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Cortex
        INFOPLIST_KEY_NSCameraUsageDescription: "Cortex uses the camera to scan the pairing code shown on your computer."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Cortex connects directly to your computer when both are on the same network."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"

  # The same screens as a Mac window. Not shipped: it is how the screens
  # are tried and photographed on a machine with no simulator.
  CortexMac:
    type: application
    platform: macOS
    sources:
      - Cortex
      - Core/cortex_mobile.swift
    dependencies:
      - framework: Core/CortexCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cortex.remote.mac
        PRODUCT_NAME: CortexMac
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: "NO"
