[project]
name = "cortex-ml"
version = "0.1.0"
description = "Optional code embedding service for the Cortex coding harness."
requires-python = ">=3.11"
dependencies = ["numpy", "sentence-transformers>=6.1", "torch", "transformers"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cortex_ml"]
