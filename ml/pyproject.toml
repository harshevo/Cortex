[project]
name = "cortex-ml"
version = "0.1.0"
description = "The learned components of Cortex: embeddings now, memory and prediction models later."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "sentence-transformers>=6.1",
    "torch",
    "torchvision>=0.29.1",
    "transformers",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cortex_ml"]
