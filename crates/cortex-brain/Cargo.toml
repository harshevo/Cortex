[package]
name = "cortex-brain"
description = "The one brain: columns of spiking cells whose dendritic branches learn what comes next, from words, the agent's work and the market alike; memories kept as the cells that held them and recalled by re-firing them; sleep that replays, prunes and dreams; value, attention, curiosity and a measured model of itself; the agent's explicit memory of past tasks; and the background service that keeps it alive. It advises; it never acts."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cortex-brain-service"
path = "src/bin/cortex-brain-service.rs"

[dependencies]
cortex-core.workspace = true
cortex-providers.workspace = true
cortex-retrieval.workspace = true

async-trait.workspace = true
base64 = "0.22"
postcard = { version = "1", features = ["use-std"] }
reqwest.workspace = true
regex.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4"
