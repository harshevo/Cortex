[package]
name = "cortex-gui"
description = "The Cortex desktop app: a native interface for the coding harness."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cortex-gui"
path = "src/main.rs"

[dependencies]
cortex-cli.workspace = true
cortex-core.workspace = true
cortex-providers.workspace = true
cortex-retrieval.workspace = true
cortex-skills.workspace = true

anyhow.workspace = true
arboard = "3.6"
async-trait.workspace = true
clap.workspace = true
dirs = "7"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu"] }
keyring = "4"
pdf-extract = "0.12"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
reqwest.workspace = true
rfd = { version = "0.17", default-features = false }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

# On macOS Cmd+V is taken by an Edit menu, so that pasting pictures and
# files works: the window library only passes on pasted text.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20", default-features = false }

# Linux has two windowing systems and no file dialog of its own: the
# window library is built for both, and folders are picked through the
# desktop's portal.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
