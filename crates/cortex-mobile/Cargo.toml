[package]
name = "cortex-mobile"
description = "The phone apps' core: the agent that runs on the phone, the connection to a desktop, and everything the screens show, shared by iOS and Android."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "cortex_mobile"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
cortex-brain.workspace = true
cortex-cli.workspace = true
cortex-core.workspace = true
cortex-living.workspace = true
cortex-liquid.workspace = true
cortex-market.workspace = true
cortex-memory.workspace = true
cortex-providers.workspace = true
cortex-remote.workspace = true

anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
serde.workspace = true

base64 = "0.22"
serde_json.workspace = true
tokio.workspace = true
uniffi = "0.32"

[dev-dependencies]
tempfile.workspace = true
