[package]
name = "cortex-neural"
description = "A standalone brain: columns of spiking cells whose dendritic branches learn to predict the next word, memories stored as the cells that fired and recalled by re-firing them, sleep that replays and prunes, and a record of every step it takes and why. Taught by an LLM teacher; it does not act."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
postcard = { version = "1", features = ["use-std"] }
tempfile.workspace = true
base64 = "0.22"
