repo = "../../../sources/tradelyzer"
commit = "1e606dc257a4172721171baa75c22c376dd09dfe"
remove = ["tests/exchanges.test.ts"]
link = ["node_modules"]
link_from = "../../../sources/tradelyzer-deps"

[check]
command = "npx vitest run"

[[milestone]]
name = "partial-exit-fees"
command = "npx vitest run tests/exchange-sample.test.ts tests/exchanges.test.ts -t '^completed\\ exchange\\ trades\\ matches\\ spot\\ partial\\ exits\\ with\\ proportional\\ entry\\ fees\\ and\\ stable\\ IDs$|^imports\\ binance\\ perpetual\\ samples\\ through\\ the\\ real\\ adapter\\ and\\ persists\\ them$|^imports\\ binance\\ spot\\ samples\\ through\\ the\\ real\\ adapter\\ and\\ persists\\ them$|^imports\\ bybit\\ perpetual\\ samples\\ through\\ the\\ real\\ adapter\\ and\\ persists\\ them$|^imports\\ coinbase\\ spot\\ samples\\ through\\ the\\ real\\ adapter\\ and\\ persists\\ them$'"

[[milestone]]
name = "same-millisecond-order"
command = "npx vitest run tests/exchanges.test.ts -t '^completed\\ exchange\\ trades\\ orders\\ Bybit\\ fills\\ at\\ the\\ same\\ millisecond\\ by\\ sequence\\ rather\\ than\\ random\\ IDs$'"

[[milestone]]
name = "reversal-opening-lost"
command = "npx vitest run tests/exchanges.test.ts -t '^retains\\ a\\ verified\\ reversal\\ opening\\ when\\ its\\ prior\\ position\\ is\\ outside\\ the\\ range$'"

[[milestone]]
name = "cent-rounding-drift"
command = "npx vitest run tests/exchanges.test.ts -t '^import\\ accounting\\ regressions\\ preserves\\ the\\ total\\ one\\-cent\\ fee\\ when\\ an\\ exit\\ matches\\ multiple\\ lots$'"

[[milestone]]
name = "bybit-repeating-cursor"
command = "npx vitest run tests/exchanges.test.ts -t '^exchange\\ REST\\ adapters\\ fails\\ instead\\ of\\ silently\\ truncating\\ repeating\\ cursors$'"
