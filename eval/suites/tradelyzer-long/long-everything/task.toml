command = "npx vitest run tests/calendar.test.ts -t '^Luxon\\ calendar\\ covers\\ all\\ dates\\ of\\ a\\ six\\-week\\ month\\ including\\ adjacent\\ days$|^Luxon\\ calendar\\ handles\\ leap\\ February\\ and\\ December\\ rollover$'"

[[milestone]]
name = "negative-amounts"
command = "npx vitest run tests/journal.test.ts tests/trade-file.test.ts -t '^completed\\-trade\\ imports\\ preserves\\ exact\\ cents\\ including\\ large\\ values\\ and\\ negative\\ fractions$|^day\\ journal\\ logic\\ summarizes\\ winning,\\ losing,\\ breakeven\\ and\\ empty\\ days$|^day\\ journal\\ logic\\ warns\\ only\\ when\\ net\\ loss\\ strictly\\ exceeds\\ the\\ configured\\ limit$'"

[[milestone]]
name = "cross-day-screenshot"
command = "npx vitest run tests/journal-database.test.ts -t '^prevents\\ attachment\\ changes\\ from\\ modifying\\ another\\ day'\"'\"'s\\ screenshots$'"

[[milestone]]
