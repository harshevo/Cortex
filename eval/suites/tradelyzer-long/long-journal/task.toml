instruction = "Several problems have been reported in this project. They are separate; fix all of them. Keep track of which you have dealt with, and check each fix before moving on.\n\n1. The trade calendar should file each trade under the day it closed in the time zone the user has chosen. A user whose calendar is set to New York reports that trades closed in the evening appear on the following day. Fix it.\n\n2. The month view of the trade calendar shows whole weeks, Monday to Sunday, including the days of neighbouring months that fall in the first and last week. In months whose last day is not a Sunday, the final week is missing, so the last days of the month cannot be seen. Fix it.\n\n3. Losing trades with cents are displayed wrongly throughout the app. A net P&L of -1.50 shows as a loss of 0.50, and -0.01 shows as a gain of one cent. Whole dollar losses and all gains are fine. Find the cause and fix it.\n\n4. When a day's journal is saved, the caller passes the ids of screenshots to remove. Nothing checks that those screenshots belong to the day being saved, so saving one day's journal can delete another day's screenshot. Make the save refuse, with the error `Screenshot belongs to another day.`, when any screenshot to remove belongs to a different day. In that case nothing may be saved or deleted. An id that matches no stored screenshot is not an error.\n\n5. A journal entry may have at most 10 tags. Some entries saved by an older version have more, up to 30. Such an entry can no longer be edited at all, because every save fails the 10-tag rule.\n\nChange `journalSchemaFor(previous)` so that when the previously saved entry has more than 10 tags, the new version is accepted if it has at most 10 tags, or if every one of its tags was already on the saved entry (tags may be kept or removed, not added), and never more than 30. When that rule is broken the message must be `Choose up to 10 mistake tags. Existing tags can be kept or removed.` Entries with no saved version, or whose saved version has 10 tags or fewer, keep the plain 10-tag limit and its existing message."
max_steps = 80

[source]
repo = "../../../sources/tradelyzer"
commit = "1e606dc257a4172721171baa75c22c376dd09dfe"
remove = ["tests/calendar.test.ts", "tests/trade-file.test.ts", "tests/journal.test.ts", "tests/journal-database.test.ts"]
link = ["node_modules"]
link_from = "../../../sources/tradelyzer-deps"

[check]
