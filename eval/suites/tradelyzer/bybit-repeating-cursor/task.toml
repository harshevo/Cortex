instruction = "Bybit's execution history is read page by page using a cursor. If Bybit returns a cursor it has already returned, the import keeps requesting pages until it runs out of its request budget and then fails with a misleading error. It should instead stop as soon as a cursor repeats, with the error `Bybit pagination did not advance. Retry with a smaller range.`"

