instruction = "Bybit sometimes reports an entry fill and its exit fill with the same millisecond timestamp. Bybit also supplies a sequence number that gives the true order of executions, but imports of such round trips come out wrong: the exit is processed before the entry, so the trade is reported as unmatched or with the wrong profit. Execution ids are random and say nothing about order. Fix the import so that fills with the same timestamp are processed in their true order."

