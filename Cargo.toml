[workspace]
resolver = "3"

members = [
    "crates/cortex-core",
    "crates/cortex-providers",
    "crates/cortex-index",
    "crates/cortex-retrieval",
    "crates/cortex-verify",
    "crates/cortex-router",
    "crates/cortex-tools",
    "crates/cortex-skills",
    "crates/cortex-eval",
    "crates/cortex-cli",
    "crates/cortex-gui",
]

# What plain `cargo build`, `cargo test` and `cargo run` act on. The desktop
# app is left out so that `cargo run` still means the `cortex` command and
# the agent can be built without the graphics libraries. Build the app with
# `-p cortex-gui`.
default-members = [
    "crates/cortex-core",
    "crates/cortex-providers",
    "crates/cortex-index",
    "crates/cortex-retrieval",
    "crates/cortex-verify",
    "crates/cortex-router",
    "crates/cortex-tools",
    "crates/cortex-skills",
    "crates/cortex-eval",
    "crates/cortex-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
cortex-core = { path = "crates/cortex-core" }
cortex-providers = { path = "crates/cortex-providers" }
cortex-index = { path = "crates/cortex-index" }
cortex-retrieval = { path = "crates/cortex-retrieval" }
cortex-verify = { path = "crates/cortex-verify" }
cortex-router = { path = "crates/cortex-router" }
cortex-cli = { path = "crates/cortex-cli" }
cortex-tools = { path = "crates/cortex-tools" }
cortex-skills = { path = "crates/cortex-skills" }
cortex-eval = { path = "crates/cortex-eval" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util"] }
toml = "0.8"

# The desktop app redraws every frame. Unoptimised, the libraries it draws
# with are several times slower, which shows as a low frame rate. This
# optimises dependencies in debug builds while leaving this workspace's own
# crates quick to compile and easy to debug.
[profile.dev.package."*"]
opt-level = 2
